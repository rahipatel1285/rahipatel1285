<svg xmlns="http://www.w3.org/2000/svg" width="860" height="210" viewBox="0 0 860 210" role="img" aria-labelledby="title">
  <title id="title">Mission file 001: RawStrix, a cybersecurity platform and cyber range. In development.</title>
  <defs><clipPath id="c"><rect x="0" y="0" width="860" height="210" rx="10"/></clipPath></defs>
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
    .meta { font-size: 14px; letter-spacing: 1px; fill: #59636e; }
    .label { font-size: 13px; letter-spacing: 1.5px; fill: #59636e; }
    .value { font-size: 18px; fill: #1f2328; }
    .acc { fill: #9a5b00; }
    .dot { transform-box: fill-box; transform-origin: center; animation: pulse 1.8s ease-out infinite; }
    @keyframes pulse { 0% { opacity: .7; transform: scale(1); } 100% { opacity: 0; transform: scale(3); } }
    .big { font-size: 84px; font-weight: 800; letter-spacing: 12px; fill: #1f2328; }
    .sub { font-size: 18px; fill: #59636e; }
    .redact { transform: translateX(900px); animation: declassify 2.4s cubic-bezier(.7, 0, .3, 1); }
    @keyframes declassify { 0%, 35% { transform: translateX(0); } 100% { transform: translateX(900px); } }
    @media (prefers-reduced-motion: reduce) { .redact, .dot { animation: none !important; } }
  </style>
  <rect x="0.5" y="0.5" width="859" height="209" rx="10" fill="#ffffff" stroke="#d1d9e0"/>

  <text class="mono meta" x="40" y="42">MISSION FILE 001 · FLAGSHIP</text>
  <circle class="acc dot" cx="674" cy="37" r="4.5"/>
  <circle class="acc" cx="674" cy="37" r="4.5"/>
  <text class="mono meta" x="820" y="42" text-anchor="end">IN DEVELOPMENT</text>
  <line x1="40" y1="60" x2="820" y2="60" stroke="#d1d9e0" stroke-dasharray="4 6"/>

  <text class="mono big" x="36" y="142">RAWSTRIX</text>
  <text class="mono sub" x="40" y="180">cybersecurity platform <tspan class="acc">+</tspan> cyber range</text>

  <g clip-path="url(#c)">
    <rect class="redact" x="28" y="76" width="560" height="84" fill="#1f2328"/>
  </g>
</svg>
