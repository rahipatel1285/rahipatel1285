<svg xmlns="http://www.w3.org/2000/svg" width="860" height="340" viewBox="0 0 860 340" role="img" aria-labelledby="title">
  <title id="title">Rahi Patel. Status: building. Class: security-first builder. Threat model: everyone, including me.</title>
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
    .meta { font-size: 14px; letter-spacing: 1px; fill: #59636e; }
    .label { font-size: 13px; letter-spacing: 1.5px; fill: #59636e; }
    .value { font-size: 18px; fill: #1f2328; }
    .acc { fill: #9a5b00; }
    .dot { transform-box: fill-box; transform-origin: center; animation: pulse 1.8s ease-out infinite; }
    @keyframes pulse { 0% { opacity: .7; transform: scale(1); } 100% { opacity: 0; transform: scale(3); } }
    .prompt { font-size: 20px; fill: #1f2328; }
    .name { font-size: 74px; font-weight: 700; letter-spacing: -2.5px; fill: #1f2328; }
    .proc { font-size: 17px; fill: #1f2328; }
    .cur { animation: blink 1.1s steps(1) infinite; }
    .st { animation: cycle 10s infinite; }
    .bar { transform-box: fill-box; transform-origin: left center; }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes cycle { 0%, 22% { opacity: 1; } 25%, 100% { opacity: 0; } }
    @keyframes calm { from { transform: scaleX(.9); } to { transform: scaleX(1); } }
    @keyframes chaos { 0% { transform: scaleX(1); } 18% { transform: scaleX(2.7); } 30% { transform: scaleX(.25); }
                        52% { transform: scaleX(2.2); } 66% { transform: scaleX(.6); } 100% { transform: scaleX(2.85); } }
    @media (prefers-reduced-motion: reduce) { .cur, .st, .bar, .dot { animation: none !important; } }
  </style>
  <rect x="0.5" y="0.5" width="859" height="339" rx="10" fill="#ffffff" stroke="#d1d9e0"/>

  <text class="mono meta" x="40" y="42">~/rahi · command center</text>
  <text class="mono meta" x="820" y="42" text-anchor="end">v1.285.0-unstable · uptime: classified</text>
  <line x1="40" y1="60" x2="820" y2="60" stroke="#d1d9e0" stroke-dasharray="4 6"/>

  <text class="mono prompt" x="40" y="108"><tspan class="acc">$</tspan> whoami <tspan class="acc cur">&#x2588;</tspan></text>
  <text class="sans name" x="36" y="186">Rahi Patel</text>

  <text class="mono label" x="40" y="246">STATUS</text>
  <circle class="acc dot" cx="190" cy="240" r="4.5"/>
  <circle class="acc" cx="190" cy="240" r="4.5"/>
  <text class="mono value st" x="206" y="246" style="animation-delay: 0s">building</text>
  <text class="mono value st" x="206" y="246" style="animation-delay: 2.5s" opacity="0">breaking it</text>
  <text class="mono value st" x="206" y="246" style="animation-delay: 5s" opacity="0">fixing it</text>
  <text class="mono value st" x="206" y="246" style="animation-delay: 7.5s" opacity="0">shipping</text>
  <text class="mono label" x="40" y="276">CLASS</text>
  <text class="mono value" x="206" y="276">security-first builder</text>
  <text class="mono label" x="40" y="306">THREAT MODEL</text>
  <text class="mono value" x="206" y="306">everyone, incl. me</text>

  <line x1="504" y1="88" x2="504" y2="306" stroke="#d1d9e0"/>
  <text class="mono label" x="536" y="112">PROCESSES</text>
  <rect x="536" y="143" width="104" height="16" rx="1.5" fill="#1f2328"/>
  <rect x="664" y="147" width="148" height="7" rx="3.5" fill="#eaeef2"/>
  <rect class="bar" style="animation: calm 6s ease-in-out infinite alternate" x="664" y="147" width="115" height="7" rx="3.5" fill="#9a5b00"/>
  <rect x="536" y="181" width="52" height="16" rx="1.5" fill="#1f2328"/>
  <rect x="664" y="185" width="148" height="7" rx="3.5" fill="#eaeef2"/>
  <rect class="bar" style="animation: calm 3s ease-in-out infinite alternate" x="664" y="185" width="142" height="7" rx="3.5" fill="#9a5b00"/>
  <text class="mono proc" x="536" y="232">first oss</text>
  <rect x="664" y="223" width="148" height="7" rx="3.5" fill="#eaeef2"/>
  <rect class="bar" style="animation: calm 4.5s ease-in-out infinite alternate" x="664" y="223" width="33" height="7" rx="3.5" fill="#9a5b00"/>
  <text class="mono proc" x="536" y="270">sleep</text>
  <rect x="664" y="261" width="148" height="7" rx="3.5" fill="#eaeef2"/>
  <rect class="bar" style="animation: chaos 2.6s ease-in-out infinite alternate" x="664" y="261" width="9" height="7" rx="3.5" fill="#9a5b00"/>
</svg>
